<!DOCTYPE html><html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام المحاسبي</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Tahoma, Arial, sans-serif;
        background: #f4f4f4;
        padding: 15px;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        color: #1a237e;
        margin: 20px 0;
    }

    .menu {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 20px 0;
    }

    .menu button {
        flex: 1;
        min-width: 100px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #3f51b5;
        color: white;
        cursor: pointer;
    }

    .menu button:hover {
        background: #303f9f;
    }

    .section {
        display: none;
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .section.active {
        display: block;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin: 15px 0;
    }

    th,
    td {
        padding: 10px;
        border: 1px solid #ddd;
        text-align: center;
    }

    th {
        background: #3f51b5;
        color: white;
    }

    form button {
        width: 100%;
        padding: 14px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    form button:hover {
        background: #388e3c;
    }

    .entry-card {
        background: #e3f2fd;
        padding: 15px;
        border-radius: 8px;
        margin: 10px 0;
        border-right: 4px solid #2196f3;
    }

    .debit {
        color: #c62828;
    }

    .credit {
        color: #2e7d32;
    }

    .error {
        background: #ffebee;
        color: #c62828;
        padding: 12px;
        border-radius: 8px;
        margin: 10px 0;
    }

    .success {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 12px;
        border-radius: 8px;
        margin: 10px 0;
    }
</style>

</head><body><div class="container"><h1>📊 النظام المحاسبي</h1>

<div class="menu">
    <button onclick="showSection('journal')">قيود اليومية</button>
    <button onclick="showSection('chart')">شجرة الحسابات</button>
    <button onclick="showSection('ledger')">الأستاذ العام</button>
    <button onclick="showSection('trial')">ميزان المراجعة</button>
</div>

<!-- قيود اليومية -->
<div id="journal" class="section active">

    <h2>📝 تسجيل قيد محاسبي</h2>

    <form id="journalForm" onsubmit="addEntry(event)">

        <input
            type="date"
            id="entryDate"
            required
        >

        <input
            type="text"
            id="description"
            placeholder="البيان"
            required
        >

        <table>
            <tr>
                <th>الحساب</th>
                <th>مدين</th>
                <th>دائن</th>
            </tr>

            <tr>
                <td>
                    <select id="debitAccount" required></select>
                </td>

                <td>
                    <input
                        type="number"
                        id="debitAmount"
                        min="0"
                        step="0.01"
                        required
                    >
                </td>

                <td>0</td>
            </tr>

            <tr>
                <td>
                    <select id="creditAccount" required></select>
                </td>

                <td>0</td>

                <td>
                    <input
                        type="number"
                        id="creditAmount"
                        min="0"
                        step="0.01"
                        required
                    >
                </td>
            </tr>
        </table>

        <button type="submit">
            تسجيل القيد
        </button>

    </form>

    <div id="entries"></div>

</div>

<!-- شجرة الحسابات -->
<div id="chart" class="section">

    <h2>🌳 شجرة الحسابات</h2>

    <div id="chartContent"></div>

</div>

<!-- الأستاذ العام -->
<div id="ledger" class="section">

    <h2>📒 الأستاذ العام</h2>

    <div id="ledgerContent"></div>

</div>

<!-- ميزان المراجعة -->
<div id="trial" class="section">

    <h2>⚖️ ميزان المراجعة</h2>

    <div id="trialContent"></div>

</div>

</div><script>

    // ==============================
    // دليل الحسابات
    // ==============================

    const accounts = [
        {
            code: 1001,
            name: "الصندوق",
            type: "أصول"
        },
        {
            code: 1002,
            name: "البنك",
            type: "أصول"
        },
        {
            code: 2001,
            name: "الموردين",
            type: "خصوم"
        },
        {
            code: 3001,
            name: "المبيعات",
            type: "إيرادات"
        },
        {
            code: 4001,
            name: "الإيجار",
            type: "مصروفات"
        },
        {
            code: 4002,
            name: "الرواتب",
            type: "مصروفات"
        }
    ];


    // ==============================
    // تحميل القيود من التخزين المحلي
    // ==============================

    let entries = [];

    try {

        entries = JSON.parse(
            localStorage.getItem("entries") || "[]"
        );

        if (!Array.isArray(entries)) {
            entries = [];
        }

    } catch (error) {

        console.error("خطأ في قراءة القيود:", error);

        entries = [];

    }


    // ==============================
    // ملء الحسابات
    // ==============================

    function fillSelects() {

        const html = accounts
            .map(account => {

                return `
                    <option value="${account.code}">
                        ${account.code} - ${account.name}
                    </option>
                `;

            })
            .join("");

        document.getElementById("debitAccount").innerHTML = html;

        document.getElementById("creditAccount").innerHTML = html;
    }


    // ==============================
    // تبديل الأقسام
    // ==============================

    function showSection(id) {

        document
            .querySelectorAll(".section")
            .forEach(section => {

                section.classList.remove("active");

            });

        const section = document.getElementById(id);

        if (!section) {
            console.error("القسم غير موجود:", id);
            return;
        }

        section.classList.add("active");


        if (id === "chart") {
            showChart();
        }

        if (id === "ledger") {
            showLedger();
        }

        if (id === "trial") {
            showTrial();
        }

    }


    // ==============================
    // إضافة قيد
    // ==============================

    function addEntry(event) {

        event.preventDefault();


        const date =
            document.getElementById("entryDate").value;

        const desc =
            document.getElementById("description").value.trim();

        const debitAcc =
            document.getElementById("debitAccount").value;

        const creditAcc =
            document.getElementById("creditAccount").value;

        const debitAmt =
            parseFloat(
                document.getElementById("debitAmount").value
            ) || 0;

        const creditAmt =
            parseFloat(
                document.getElementById("creditAmount").value
            ) || 0;


        // التحقق من المبالغ

        if (debitAmt <= 0 || creditAmt <= 0) {

            alert("أدخل المبالغ من فضلك.");

            return;
        }


        // يجب أن يكون القيد متوازنًا

        if (debitAmt !== creditAmt) {

            alert(
                "القيد غير متوازن.\n" +
                "يجب أن يساوي إجمالي المدين إجمالي الدائن."
            );

            return;
        }


        // منع نفس الحساب

        if (debitAcc === creditAcc) {

            alert(
                "لا يمكن أن يكون الحساب المدين هو نفسه الحساب الدائن."
            );

            return;
        }


        // إنشاء القيد

        const entry = {

            id: Date.now(),

            number:
                "قيد-" +
                String(entries.length + 1).padStart(4, "0"),

            date: date,

            description: desc,

            debitAccount: debitAcc,

            debitAmount: debitAmt,

            creditAccount: creditAcc,

            creditAmount: creditAmt

        };


        // إضافة القيد

        entries.unshift(entry);


        // حفظ دائم في المتصفح

        localStorage.setItem(
            "entries",
            JSON.stringify(entries)
        );


        // إعادة النموذج

        document
            .getElementById("journalForm")
            .reset();


        // عرض القيود

        showEntries();


        alert("تم تسجيل القيد بنجاح.");

    }


    // ==============================
    // عرض القيود
    // ==============================

    function showEntries() {

        const div =
            document.getElementById("entries");


        if (entries.length === 0) {

            div.innerHTML =
                "<p>لا توجد قيود بعد.</p>";

            return;
        }


        let html =
            "<h3>القيود المسجلة</h3>";


        entries.forEach(entry => {

            const debitAccount =
                accounts.find(
                    account =>
                        String(account.code) ===
                        String(entry.debitAccount)
                );


            const creditAccount =
                accounts.find(
                    account =>
                        String(account.code) ===
                        String(entry.creditAccount)
                );


            html += `

                <div class="entry-card">

                    <b>${entry.number}</b>
                    - ${entry.date}

                    <br><br>

                    ${entry.description}

                    <br><br>

                    من:
                    ${debitAccount ? debitAccount.name : "حساب محذوف"}

                    <span class="debit">
                        ${Number(entry.debitAmount).toFixed(2)}
                    </span>

                    <br>

                    إلى:
                    ${creditAccount ? creditAccount.name : "حساب محذوف"}

                    <span class="credit">
                        ${Number(entry.creditAmount).toFixed(2)}
                    </span>

                </div>

            `;

        });


        div.innerHTML = html;

    }


    // ==============================
    // حساب الرصيد
    // ==============================

    function getBalance(code) {

        let debitSum = 0;

        let creditSum = 0;


        entries.forEach(entry => {

            if (
                String(entry.debitAccount) ===
                String(code)
            ) {

                debitSum += Number(entry.debitAmount) || 0;

            }


            if (
                String(entry.creditAccount) ===
                String(code)
            ) {

                creditSum += Number(entry.creditAmount) || 0;

            }

        });


        return {

            debit: debitSum,

            credit: creditSum,

            net: debitSum - creditSum

        };

    }


    // ==============================
    // شجرة الحسابات
    // ==============================

    function showChart() {

        let html = `

            <table>

                <tr>
                    <th>الكود</th>
                    <th>الاسم</th>
                    <th>النوع</th>
                    <th>الرصيد</th>
                </tr>

        `;


        accounts.forEach(account => {

            const balance =
                getBalance(account.code);

            const net =
                balance.net.toFixed(2);

            const cls =
                balance.net >= 0
                    ? "debit"
                    : "credit";


            html += `

                <tr>

                    <td>${account.code}</td>

                    <td>${account.name}</td>

                    <td>${account.type}</td>

                    <td class="${cls}">
                        ${net}
                    </td>

                </tr>

            `;

        });


        html += "</table>";


        document
            .getElementById("chartContent")
            .innerHTML = html;

    }


    // ==============================
    // الأستاذ العام
    // ==============================

    function showLedger() {

        let html = "";


        accounts.forEach(account => {

            html += `

                <h4>
                    ${account.code} - ${account.name}
                </h4>

                <table>

                    <tr>
                        <th>التاريخ</th>
                        <th>البيان</th>
                        <th>مدين</th>
                        <th>دائن</th>
                        <th>الرصيد</th>
                    </tr>

            `;


            let balance = 0;


            const accountEntries =
                entries.filter(entry =>

                    String(entry.debitAccount) ===
                    String(account.code)

                    ||

                    String(entry.creditAccount) ===
                    String(account.code)

                );


            if (accountEntries.length === 0) {

                html += `

                    <tr>
                        <td colspan="5">
                            لا توجد حركات
                        </td>
                    </tr>

                `;

            } else {

                accountEntries
                    .slice()
                    .reverse()
                    .forEach(entry => {


                        if (
                            String(entry.debitAccount) ===
                            String(account.code)
                        ) {

                            balance +=
                                Number(entry.debitAmount);

                        }


                        if (
                            String(entry.creditAccount) ===
                            String(account.code)
                        ) {

                            balance -=
                                Number(entry.creditAmount);

                        }


                        html += `

                            <tr>

                                <td>
                                    ${entry.date}
                                </td>

                                <td>
                                    ${entry.description}
                                </td>

                                <td class="debit">
                                    ${
                                        String(entry.debitAccount) ===
                                        String(account.code)
                                            ? Number(entry.debitAmount).toFixed(2)
                                            : "0.00"
                                    }
                                </td>

                                <td class="credit">
                                    ${
                                        String(entry.creditAccount) ===
                                        String(account.code)
                                            ? Number(entry.creditAmount).toFixed(2)
                                            : "0.00"
                                    }
                                </td>

                                <td>
                                    ${balance.toFixed(2)}
                                </td>

                            </tr>

                        `;

                    });

            }


            html += "</table><br>";

        });


        document
            .getElementById("ledgerContent")
            .innerHTML = html;

    }


    // ==============================
    // ميزان المراجعة
    // ==============================

    function showTrial() {

        let html = `

            <table>

                <tr>

                    <th>الحساب</th>

                    <th>مدين</th>

                    <th>دائن</th>

                    <th>الرصيد</th>

                </tr>

        `;


        let totalDebit = 0;

        let totalCredit = 0;


        accounts.forEach(account => {

            const balance =
                getBalance(account.code);


            totalDebit += balance.debit;

            totalCredit += balance.credit;


            html += `

                <tr>

                    <td>
                        ${account.name}
                    </td>

                    <td class="debit">
                        ${balance.debit.toFixed(2)}
                    </td>

                    <td class="credit">
                        ${balance.credit.toFixed(2)}
                    </td>

                    <td>
                        ${balance.net.toFixed(2)}
                    </td>

                </tr>

            `;

        });


        html += `

            <tr style="font-weight:bold">

                <td>
                    المجموع
                </td>

                <td>
                    ${totalDebit.toFixed(2)}
                </td>

                <td>
                    ${totalCredit.toFixed(2)}
                </td>

                <td>
                    ${(totalDebit - totalCredit).toFixed(2)}
                </td>

            </tr>

            </table>

        `;


        document
            .getElementById("trialContent")
            .innerHTML = html;

    }


    // ==============================
    // التشغيل الأولي
    // ==============================

    document.getElementById("entryDate").value =
        new Date().toISOString().split("T")[0];

    fillSelects();

    showEntries();

</script></body>
</html>
