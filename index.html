<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام المحاسبي مع الأرصدة</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f4f4f4;padding:15px}
        .container{max-width:900px;margin:0 auto}
        h1{text-align:center;color:#1a237e;margin:20px 0}
        .menu{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
        .menu button{flex:1;min-width:100px;padding:12px;border:none;border-radius:8px;background:#3f51b5;color:white;cursor:pointer}
        .menu button:hover{background:#1a237e}
        .section{display:none;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .section.active{display:block}
        input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
        table{width:100%;border-collapse:collapse;margin:15px 0}
        th,td{padding:10px;border:1px solid #ddd;text-align:center}
        th{background:#3f51b5;color:white}
        form button{width:100%;padding:14px;background:#4caf50;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
        .entry-card{background:#e3f2fd;padding:15px;border-radius:8px;margin:10px 0;border-right:4px solid #2196f3}
        .debit{color:#c62828}.credit{color:#2e7d32}
        .balance-positive{color:#1b5e20}.balance-negative{color:#b71c1c}
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 النظام المحاسبي</h1>
        <div class="menu">
            <button onclick="showSection( chart )">شجرة الحسابات</button>
            <button onclick="showSection( journal )">قيود اليومية</button>
            <button onclick="showSection( ledger )">الأستاذ العام</button>
            <button onclick="showSection( trial )">ميزان المراجعة</button>
        </div>

        <div id="journal" class="section active">
            <h2>📝 تسجيل قيد محاسبي</h2>
            <form id="journalForm">
                <input type="date" id="entryDate" required>
                <input type="text" id="description" placeholder="البيان" required>
                <table>
                    <tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr>
                    <tr>
                        <td><select id="debitAccount"></select></td>
                        <td><input type="number" id="debitAmount" min="0" step="0.01"></td>
                        <td>0</td>
                    </tr>
                    <tr>
                        <td><select id="creditAccount"></select></td>
                        <td>0</td>
                        <td><input type="number" id="creditAmount" min="0" step="0.01"></td>
                    </tr>
                </table>
                <button type="submit">تسجيل القيد</button>
            </form>
            <div id="entries"></div>
        </div>

        <div id="chart" class="section">
            <h2>🌳 شجرة الحسابات</h2>
            <div id="chartContent"></div>
        </div>
        <div id="ledger" class="section">
            <h2>📒 الأستاذ العام</h2>
            <div id="ledgerContent"></div>
        </div>
        <div id="trial" class="section">
            <h2>⚖️ ميزان المراجعة</h2>
            <div id="trialContent"></div>
        </div>
    </div>
    <script>
        // الحسابات مع الرصيد الافتتاحي (Opening Balance)
        const accounts = [
            {code: 1001 ,name: الصندوق ,type: أصول ,openingDebit:5000,openingCredit:0},
            {code: 1002 ,name: البنك ,type: أصول ,openingDebit:20000,openingCredit:0},
            {code: 2001 ,name: الموردين ,type: خصوم ,openingDebit:0,openingCredit:3000},
            {code: 3001 ,name: المبيعات ,type: إيرادات ,openingDebit:0,openingCredit:0},
            {code: 4001 ,name: الإيجار ,type: مصروفات ,openingDebit:0,openingCredit:0},
            {code: 4002 ,name: رواتب ,type: مصروفات ,openingDebit:0,openingCredit:0}
        ];

        let entries = JSON.parse(localStorage.getItem( entries )|| [] );

        // ملء قوائم الحسابات
        function populateAccountSelects(){
            const selects = document.querySelectorAll( #debitAccount, #creditAccount );
            selects.forEach(select=>{
                select.innerHTML =   ;
                accounts.forEach(acc=>{
                    select.innerHTML += `<option value="${acc.code}">${acc.code} - ${acc.name}</option>`;
                });
            });
        }

        // حساب الرصيد الحالي لحساب معين
        function getCurrentBalance(accountCode){
            const acc = accounts.find(a=>a.code===accountCode);
            let totalDebit = acc.openingDebit;
            let totalCredit = acc.openingCredit;
            entries.forEach(e=>{
                if(e.debitAccount===accountCode) totalDebit += e.debitAmount;
                if(e.creditAccount===accountCode) totalCredit += e.creditAmount;
            });
            return {debit:totalDebit, credit:totalCredit, net:totalDebit-totalCredit};
        }

        // عرض القيود
        function displayEntries(){
            const container = document.getElementById( entries );
            container.innerHTML =  <h3 style="margin-top:20px">القيود المسجلة</h3> ;
            if(entries.length===0){
                container.innerHTML +=  <p>لا توجد قيود بعد.</p> ; return;
            }
            entries.forEach(e=>{
                const da = accounts.find(a=>a.code===e.debitAccount);
                const ca = accounts.find(a=>a.code===e.creditAccount);
                container.innerHTML += `
                <div class="entry-card">
                    <b>${e.number}</b> - ${e.date}
                    <p>${e.description}</p>
                    <p>من حـ / ${da.name} <span class="debit">${e.debitAmount.toFixed(2)}</span></p>
                    <p>إلى حـ / ${ca.name} <span class="credit">${e.creditAmount.toFixed(2)}</span></p>
                </div>`;
            });
        }

        // معالجة نموذج القيد
        document.getElementById( journalForm ).addEventListener( submit ,function(e){
            e.preventDefault();
            const da = document.getElementById( debitAccount ).value;
            const dam = parseFloat(document.getElementById( debitAmount ).value);
            const ca = document.getElementById( creditAccount ).value;
            const cam = parseFloat(document.getElementById( creditAmount ).value);
            const desc = document.getElementById( description ).value;
            const date = document.getElementById( entryDate ).value;
            if(!dam||!cam) return alert( الرجاء إدخال المبالغ );
            if(da===ca) return alert( لا يمكن تشابه الحسابين );
            entries.unshift({
                id:Date.now(),
                number: قيد- +(entries.length+1),
                date,description:desc,
                debitAccount:da,debitAmount:dam,
                creditAccount:ca,creditAmount:cam
            });
            localStorage.setItem( entries ,JSON.stringify(entries));
            displayEntries();
            this.reset();
        });

        // عرض شجرة الحسابات مع الأرصدة
        function updateChart(){
            let html =  <table><tr><th>الكود</th><th>الاسم</th><th>النوع</th><th>الرصيد</th></tr> ;
            accounts.forEach(acc=>{
                const bal = getCurrentBalance(acc.code);
                let balanceText =   ;
                if(bal.net>0) balanceText = `<span class="balance-positive">${bal.net.toFixed(2)} (مدين)</span>`;
                else if(bal.net<0) balanceText = `<span class="balance-negative">${Math.abs(bal.net).toFixed(2)} (دائن)</span>`;
                else balanceText =  0.00 ;
                html += `<tr><td>${acc.code}</td><td>${acc.name}</td><td>${acc.type}</td><td>${balanceText}</td></tr>`;
            });
            document.getElementById( chartContent ).innerHTML = html+ </table> ;
        }

        // عرض الأستاذ العام مع ترحيل الأرصدة
        function updateLedger(){
            let html =   ;
            accounts.forEach(acc=>{
                html += `<h4>${acc.code} - ${acc.name}</h4>
                <table>
                    <tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>`;
                // رصيد افتتاحي
                const opening = acc.openingDebit - acc.openingCredit;
                let runningBalance = opening;
                html += `<tr style="background:#f9f9f9"><td colspan="2">رصيد افتتاحي</td>
                    <td>${acc.openingDebit.toFixed(2)}</td><td>${acc.openingCredit.toFixed(2)}</td>
                    <td>${runningBalance.toFixed(2)}</td></tr>`;
                
                const relatedEntries = entries.filter(en=>en.debitAccount===acc.code||en.creditAccount===acc.code);
                if(relatedEntries.length===0){
                    html +=  <tr><td colspan="5">لا توجد حركات</td></tr> ;
                } else {
                    relatedEntries.forEach(en=>{
                        if(en.debitAccount===acc.code) runningBalance += en.debitAmount;
                        if(en.creditAccount===acc.code) runningBalance -= en.creditAmount;
                        html += `<tr>
                            <td>${en.date}</td><td>${en.description}</td>
                            <td class="debit">${en.debitAccount===acc.code?en.debitAmount.toFixed(2): 0.00 }</td>
                            <td class="credit">${en.creditAccount===acc.code?en.creditAmount.toFixed(2): 0.00 }</td>
                            <td>${runningBalance.toFixed(2)}</td>
                        </tr>`;
                    });
                }
                html +=  </table><br> ;
            });
            document.getElementById( ledgerContent ).innerHTML = html;
        }

        // عرض ميزان المراجعة بالأرصدة
        function updateTrial(){
            let html =  <table><tr><th>الحساب</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr> ;
            let totalDebit=0, totalCredit=0;
            accounts.forEach(acc=>{
                const bal = getCurrentBalance(acc.code);
                totalDebit += bal.debit;
                totalCredit += bal.credit;
                html += `<tr>
                    <td>${acc.name}</td>
                    <td class="debit">${bal.debit.toFixed(2)}</td>
                    <td class="credit">${bal.credit.toFixed(2)}</td>
                    <td>${bal.net.toFixed(2)}</td>
                </tr>`;
            });
            html += `<tr style="font-weight:bold;background:#f5f5f5">
                <td>المجموع</td>
                <td>${totalDebit.toFixed(2)}</td>
                <td>${totalCredit.toFixed(2)}</td>
                <td></td></tr></table>`;
            document.getElementById( trialContent ).innerHTML = html;
        }

        function showSection(id){
            document.querySelectorAll( .section ).forEach(s=>s.classList.remove( active ));
            document.getElementById(id).classList.add( active );
            if(id=== chart )updateChart();
            if(id=== ledger )updateLedger();
            if(id=== trial )updateTrial();
        }

        // تهيئة
        populateAccountSelects();
        displayEntries();
    </script>
</body>
</html>
