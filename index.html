<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام المحاسبي</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f4f4f4;padding:15px}
        .container{max-width:900px;margin:0 auto}
        h1{text-align:center;color:#1a237e;margin:20px 0}
        .menu{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
        .menu button{flex:1;min-width:100px;padding:12px;border:none;border-radius:8px;background:#3f51b5;color:white;cursor:pointer}
        .section{display:none;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .section.active{display:block}
        input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
        table{width:100%;border-collapse:collapse;margin:15px 0}
        th,td{padding:10px;border:1px solid #ddd;text-align:center}
        th{background:#3f51b5;color:white}
        form button{width:100%;padding:14px;background:#4caf50;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
        .entry-card{background:#e3f2fd;padding:15px;border-radius:8px;margin:10px 0;border-right:4px solid #2196f3}
        .debit{color:#c62828}.credit{color:#2e7d32}
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 النظام المحاسبي</h1>
        <div class="menu">
            <button onclick="showSection( journal )">قيود اليومية</button>
            <button onclick="showSection( chart )">شجرة الحسابات</button>
            <button onclick="showSection( ledger )">الأستاذ العام</button>
            <button onclick="showSection( trial )">ميزان المراجعة</button>
        </div>

        <div id="journal" class="section active">
            <h2>📝 تسجيل قيد محاسبي</h2>
            <form onsubmit="addEntry(event)">
                <input type="date" id="entryDate" required>
                <input type="text" id="description" placeholder="البيان" required>
                <table>
                    <tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr>
                    <tr>
                        <td><select id="debitAccount"></select></td>
                        <td><input type="number" id="debitAmount" min="0" step="0.01"></td>
                        <td>0</td>
                    </tr>
                    <tr>
                        <td><select id="creditAccount"></select></td>
                        <td>0</td>
                        <td><input type="number" id="creditAmount" min="0" step="0.01"></td>
                    </tr>
                </table>
                <button type="submit">تسجيل القيد</button>
            </form>
            <div id="entries"></div>
        </div>

        <div id="chart" class="section">
            <h2>🌳 شجرة الحسابات</h2>
            <div id="chartContent"></div>
        </div>
        <div id="ledger" class="section">
            <h2>📒 الأستاذ العام</h2>
            <div id="ledgerContent"></div>
        </div>
        <div id="trial" class="section">
            <h2>⚖️ ميزان المراجعة</h2>
            <div id="trialContent"></div>
        </div>
    </div>

    <script>
        // قاعدة بيانات مؤقتة في الذاكرة
        const accounts = [
            {code: 1001 ,name: الصندوق ,type: أصول },
            {code: 1002 ,name: البنك ,type: أصول },
            {code: 2001 ,name: الموردين ,type: خصوم },
            {code: 3001 ,name: المبيعات ,type: إيرادات },
            {code: 4001 ,name: الإيجار ,type: مصروفات },
            {code: 4002 ,name: رواتب ,type: مصروفات }
        ];

        let entries = JSON.parse(localStorage.getItem( entries ) ||  [] );

        // ملء القوائم المنسدلة
        function fillSelects() {
            const html = accounts.map(a => `<option value="${a.code}">${a.code} - ${a.name}</option>`).join(  );
            document.getElementById( debitAccount ).innerHTML = html;
            document.getElementById( creditAccount ).innerHTML = html;
        }

        // تبديل الأقسام
        function showSection(id) {
            document.querySelectorAll( .section ).forEach(s => s.classList.remove( active ));
            document.getElementById(id).classList.add( active );
            if (id ===  chart ) showChart();
            if (id ===  ledger ) showLedger();
            if (id ===  trial ) showTrial();
        }

        // إضافة قيد جديد
        function addEntry(e) {
            e.preventDefault();
            const date = document.getElementById( entryDate ).value;
            const desc = document.getElementById( description ).value;
            const debitAcc = document.getElementById( debitAccount ).value;
            const creditAcc = document.getElementById( creditAccount ).value;
            const debitAmt = parseFloat(document.getElementById( debitAmount ).value) || 0;
            const creditAmt = parseFloat(document.getElementById( creditAmount ).value) || 0;

            if (!debitAmt || !creditAmt) return alert( أدخل المبالغ من فضلك );
            if (debitAcc === creditAcc) return alert( لا يمكن أن يكون الحساب المدين هو نفسه الدائن );

            const entry = {
                id: Date.now(),
                number:  قيد-  + (entries.length + 1),
                date,
                description: desc,
                debitAccount: debitAcc,
                debitAmount: debitAmt,
                creditAccount: creditAcc,
                creditAmount: creditAmt
            };

            entries.unshift(entry);
            localStorage.setItem( entries , JSON.stringify(entries));
            document.getElementById( journalForm ).reset();
            showEntries();
        }

        // عرض كل القيود
        function showEntries() {
            const div = document.getElementById( entries );
            if (entries.length === 0) {
                div.innerHTML =  <p>لا توجد قيود بعد.</p> ;
                return;
            }
            let html =  <h3>القيود المسجلة</h3> ;
            entries.forEach(en => {
                const da = accounts.find(a => a.code === en.debitAccount);
                const ca = accounts.find(a => a.code === en.creditAccount);
                html += `<div class="entry-card">
                    <b>${en.number}</b> - ${en.date}<br>
                    ${en.description}<br>
                    من ${da.name} (مدين) <span class="debit">${en.debitAmount.toFixed(2)}</span><br>
                    إلى ${ca.name} (دائن) <span class="credit">${en.creditAmount.toFixed(2)}</span>
                </div>`;
            });
            div.innerHTML = html;
        }

        // حساب الرصيد
        function getBalance(code) {
            let debitSum = 0, creditSum = 0;
            entries.forEach(e => {
                if (e.debitAccount === code) debitSum += e.debitAmount;
                if (e.creditAccount === code) creditSum += e.creditAmount;
            });
            return { debit: debitSum, credit: creditSum, net: debitSum - creditSum };
        }

        // شجرة الحسابات
        function showChart() {
            let html =  <table><tr><th>الكود</th><th>الاسم</th><th>النوع</th><th>الرصيد</th></tr> ;
            accounts.forEach(acc => {
                const bal = getBalance(acc.code);
                const net = bal.net.toFixed(2);
                const cls = bal.net >= 0 ?  debit  :  credit ;
                html += `<tr><td>${acc.code}</td><td>${acc.name}</td><td>${acc.type}</td><td class="${cls}">${net}</td></tr>`;
            });
            document.getElementById( chartContent ).innerHTML = html +  </table> ;
        }

        // الأستاذ العام
        function showLedger() {
            let html =   ;
            accounts.forEach(acc => {
                html += `<h4>${acc.code} - ${acc.name}</h4><table>
                    <tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr>`;
                let balance = 0;
                const accEntries = entries.filter(e => e.debitAccount === acc.code || e.creditAccount === acc.code);
                if (accEntries.length === 0) {
                    html +=  <tr><td colspan="5">لا توجد حركات</td></tr> ;
                } else {
                    accEntries.forEach(e => {
                        if (e.debitAccount === acc.code) balance += e.debitAmount;
                        if (e.creditAccount === acc.code) balance -= e.creditAmount;
                        html += `<tr>
                            <td>${e.date}</td><td>${e.description}</td>
                            <td class="debit">${e.debitAccount === acc.code ? e.debitAmount.toFixed(2) :  0.00 }</td>
                            <td class="credit">${e.creditAccount === acc.code ? e.creditAmount.toFixed(2) :  0.00 }</td>
                            <td>${balance.toFixed(2)}</td>
                        </tr>`;
                    });
                }
                html +=  </table><br> ;
            });
            document.getElementById( ledgerContent ).innerHTML = html;
        }

        // ميزان المراجعة
        function showTrial() {
            let html =  <table><tr><th>الحساب</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr> ;
            let totalDebit = 0, totalCredit = 0;
            accounts.forEach(acc => {
                const bal = getBalance(acc.code);
                totalDebit += bal.debit;
                totalCredit += bal.credit;
                html += `<tr>
                    <td>${acc.name}</td>
                    <td class="debit">${bal.debit.toFixed(2)}</td>
                    <td class="credit">${bal.credit.toFixed(2)}</td>
                    <td>${bal.net.toFixed(2)}</td>
                </tr>`;
            });
            html += `<tr style="font-weight:bold"><td>المجموع</td><td>${totalDebit.toFixed(2)}</td><td>${totalCredit.toFixed(2)}</td><td></td></tr></table>`;
            document.getElementById( trialContent ).innerHTML = html;
        }

        // تشغيل أولي
        fillSelects();
        showEntries();
    </script>
</body>
</html>
